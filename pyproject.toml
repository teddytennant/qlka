[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlka"
version = "0.1.0"
description = "Additive Laplace, bump, and Riesz kernel attention via sorting in JAX"
requires-python = ">=3.10"
dependencies = ["jax", "numpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
